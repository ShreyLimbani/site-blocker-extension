<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocker - Manage Blocked Sites</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>🚫 Site Blocker</h1>
      <p class="subtitle">Stay focused, stay productive</p>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="blocked-sites">Blocked Sites</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>
    
    <!-- Blocked Sites Tab -->
    <div id="blocked-sites" class="tab-content active">
      <div class="section">
        <h2>Add Website to Block</h2>
        <div class="input-group">
          <input 
            type="text" 
            id="newSiteInput" 
            placeholder="e.g., facebook.com, twitter.com"
            class="input-field"
          >
          <button id="addSiteBtn" class="btn btn-primary">Add</button>
        </div>
      </div>
      
      <div class="section">
        <h2>Blocked Websites</h2>
        <div id="blockedSitesList" class="sites-list">
          <p class="loading">Loading...</p>
        </div>
      </div>
    </div>
    
    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
      <div class="section">
        <h2>Daily Limit</h2>
        <div class="limit-display">
          <div class="limit-item">
            <span class="limit-label">Used Today:</span>
            <span id="dailyUsed" class="limit-value">0 min</span>
          </div>
          <div class="limit-item">
            <span class="limit-label">Remaining:</span>
            <span id="dailyRemaining" class="limit-value">60 min</span>
          </div>
        </div>
      </div>
      
      <div class="section">
        <h2>Working Hours</h2>
        <p class="hint">Override available only during working hours</p>
        <div class="time-inputs">
          <div class="time-group">
            <label>Start Time:</label>
            <div class="time-picker">
              <input type="number" id="startHour" class="time-input" min="0" max="23" value="9">
              <span class="separator">:</span>
              <input type="number" id="startMinute" class="time-input" min="0" max="59" value="00">
            </div>
          </div>
          <div class="time-group">
            <label>End Time:</label>
            <div class="time-picker">
              <input type="number" id="endHour" class="time-input" min="0" max="23" value="17">
              <span class="separator">:</span>
              <input type="number" id="endMinute" class="time-input" min="0" max="59" value="00">
            </div>
          </div>
        </div>
        <button id="saveHoursBtn" class="btn btn-primary">Save Working Hours</button>
      </div>

      <div class="section">
        <h2>Appearance</h2>
        <div class="theme-selector">
          <label class="theme-option">
            <input type="radio" name="theme" value="light">
            <span class="theme-label">Light</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="dark">
            <span class="theme-label">Dark</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="auto" checked>
            <span class="theme-label">Auto</span>
          </label>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>Version 1.0.0</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
